<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5a45">
<title>Vittace Bosque CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: ferramenta de gestão calma e precisa, para síndico, morador e construtora
   IDEA: a maquete branca de stand de vendas — o condomínio como objeto que se desmonta
   PICTURE: implantação real das 28 torres em 3D; torre que abre em andares; planta 3D do apto
   COLOUR and TYPE: verde Vittace (#0f5a45) dominante, papel branco de maquete, âmbar de destaque; Manrope
   LAYOUT: cena 3D ocupando a tela, painel de CRM à direita (abaixo no celular), migalhas no topo */
:root{color-scheme:light dark;
--bg:light-dark(#eef1ec,#0d1512);--panel:light-dark(#ffffff,#131d19);--ink:light-dark(#14221c,#e6eee9);
--mute:light-dark(#5b6b63,#93a59c);--line:light-dark(#dfe5df,#24312b);--brand:light-dark(#0f5a45,#4fc19a);
--brand-ink:light-dark(#ffffff,#08130f);--soft:light-dark(#e5efe9,#1a2a23);--amber:#f0a92a;--red:#d9503a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;line-height:1;color:var(--brand);letter-spacing:-.02em}
.logo small{display:block;font-weight:600;font-size:11px;color:var(--mute);letter-spacing:0;margin-top:3px}
.roles{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:2px;margin-left:auto}
.roles button{border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;min-height:38px;color:var(--mute)}
.roles button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.who{font-size:13px;color:var(--mute);white-space:nowrap}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
.stage{position:relative;overflow:hidden;min-height:340px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .28s}
.crumbs{position:absolute;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.crumbs button{border:0;background:var(--panel);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600;box-shadow:0 2px 10px #0002;min-height:38px}
.crumbs button:last-child{background:var(--brand);color:var(--brand-ink)}
.modes{position:absolute;left:14px;bottom:14px;z-index:3;background:var(--panel);border-radius:12px;padding:10px 12px;box-shadow:0 2px 14px #0002;max-width:calc(100% - 28px)}
.modes select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:14px;margin-bottom:8px;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hint{position:absolute;right:14px;bottom:14px;z-index:3;font-size:12.5px;color:var(--mute);background:var(--panel);padding:6px 10px;border-radius:9px;opacity:.92}
#labels{position:absolute;inset:0;pointer-events:none;z-index:2}
.tl{position:absolute;transform:translate(-50%,-100%);background:var(--panel);color:var(--ink);font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:6px;box-shadow:0 1px 6px #0003;white-space:nowrap;pointer-events:auto;cursor:pointer}
.tl.me{background:var(--amber);color:#1b1205}
.rl{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:12px;font-weight:700;color:#1d2a24;white-space:nowrap;text-shadow:0 0 4px #fff,0 0 4px #fff}
.rl span{display:block;font-weight:500;font-size:11px}
.north{position:absolute;top:14px;right:14px;z-index:3;width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:0 2px 10px #0002;display:grid;place-items:center}
.north b{font-size:11px;position:absolute;top:3px}.north i{width:3px;height:16px;background:linear-gradient(var(--red) 50%,var(--mute) 50%);border-radius:2px;margin-top:6px;transform-origin:50% 50%}
#tip{position:absolute;z-index:4;pointer-events:none;background:#14221cee;color:#fff;font-size:12.5px;padding:7px 10px;border-radius:9px;display:none;max-width:240px}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:8px;border-bottom:1px solid var(--line);background:var(--panel)}
.tabs button{border:0;background:none;padding:7px 0 6px;cursor:pointer;font-weight:600;font-size:11px;line-height:1.2;color:var(--mute);border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px}
.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button:hover{background:var(--soft)}
.tabs.many{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr))}.tabs.many button{flex-direction:row;justify-content:center;min-height:40px;gap:6px;font-size:12px}.tabs.many svg{width:19px;height:19px}
.tabs button[aria-selected=true]{color:var(--brand);background:var(--soft)}
.body{padding:16px;overflow-y:auto;flex:1}
h2{font-size:20px;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:14px;margin:18px 0 8px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--soft);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:24px;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:6px}
.item{border:1px solid var(--line);border-radius:11px;padding:9px 11px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.item p{margin:0;font-size:13px;color:var(--mute)}
.item strong{font-size:14px}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--soft)}
.tag.ok{background:#2f8f6b22;color:#2f8f6b}.tag.warn{background:#f0a92a33;color:#a86a00}.tag.bad{background:#d9503a22;color:var(--red)}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--brand)}
.btn{border:0;background:var(--brand);color:var(--brand-ink);padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;min-height:42px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
form{display:flex;flex-direction:column;gap:8px;margin-top:8px}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;font-size:16px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.dl dt{color:var(--mute)}.dl dd{margin:0;text-align:right;font-weight:600}
.note{font-size:12px;color:var(--mute);margin-top:16px}
.act{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.empty{color:var(--mute);font-size:13px;margin:4px 0;padding:12px;border:1px dashed var(--line);border-radius:11px;text-align:center}
.wide{width:100%;margin:10px 0}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.placa{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em;font-weight:700}
.search{flex-direction:row;margin:4px 0 8px}.search input{flex:1}
.hintp{margin:-2px 0 0;font-size:13px;color:var(--brand);font-weight:600;min-height:0}.hintp:empty{display:none}
.result{align-items:center;justify-content:flex-start;margin-bottom:10px;font-size:13.5px}
.barrow{display:block;width:100%;text-align:left;font-size:13px;margin-top:7px;border:0;background:none;padding:0;cursor:pointer}.barrow .bar{display:block}
.stack td[data-l]::before{content:none}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media(max-width:1100px) and (min-width:861px){main{grid-template-columns:minmax(0,1fr) 340px}}
@media(max-width:860px){
 body{height:auto;min-height:100vh;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
 header{position:sticky;top:0;z-index:10;padding:8px 12px calc(8px) ;padding-top:calc(8px + env(safe-area-inset-top));gap:8px}
 .logo{font-size:17px}.logo small{display:none}
 .roles{margin-left:0;width:100%;order:3}.roles button{flex:1;padding:7px 2px;font-size:13px;min-height:36px}
 .who{margin-left:auto;font-size:12px}
 main{grid-template-columns:1fr}
 .stage{height:min(52vh,460px);min-height:300px}
 .crumbs{top:10px;left:10px;right:64px}.crumbs button{padding:6px 10px;min-height:34px;font-size:13px}
 .north{top:10px;right:10px;width:40px;height:40px}
 .modes{left:10px;bottom:10px;padding:8px;max-width:calc(100% - 20px)}.modes select{margin-bottom:6px;font-size:13px}.legend{font-size:11.5px;gap:4px 10px}
 .hint{display:none}
 aside{border-left:0;border-top:1px solid var(--line);scroll-margin-top:96px}
 .tabs.many{grid-auto-flow:column;grid-template-columns:none}.tabs.many button{flex-direction:column;min-height:52px;gap:4px;font-size:10.5px}.tabs.many svg{width:22px;height:22px}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-bottom:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px #0000001a}
 .body{overflow:visible;padding:16px 14px 20px}
 h2{font-size:19px}
 .item{flex-wrap:wrap}.act{flex-direction:row;align-items:center}
}
@media(max-width:600px){
 .stack thead{display:none}.stack tr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
 .stack td{border:0;padding:0}.stack td:nth-child(2){grid-column:2}.stack td:nth-child(3){grid-column:1/-1}
 .kpi b{font-size:21px}
}
</style>
</head>
<body>
<header>
  <div class="logo">Vittace Bosque<small>CRM do condomínio · Capão Raso, Curitiba</small></div>
  <div class="roles" role="group" aria-label="Perfil de acesso">
    <button data-role="morador" aria-pressed="true">Morador</button>
    <button data-role="porteiro" aria-pressed="false">Portaria</button>
    <button data-role="sindico" aria-pressed="false">Síndico</button>
    <button data-role="construtora" aria-pressed="false">Construtora</button>
  </div>
  <div class="who" id="who"></div>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div class="crumbs" id="crumbs"></div>
    <div class="modes" id="modes"><select id="mode" aria-label="Colorir por"></select><div class="legend" id="legend"></div></div>
    <div class="hint" id="hint">Arraste para girar · role para aproximar · clique numa torre</div>
    <div id="tip"></div>
    <div class="north" id="north" title="Norte"><b>N</b><i></i></div>
  </div>
  <aside>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="body" id="panel"></div>
  </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Dados: implantação (prancha 03/22) ---------- */
// [torre, x, y na prancha, rotação°, tipo 237m²]
const T=[[1,494,110,0],[2,383,110,0],[3,273,110,0],[4,167,110,0],[5,144,297,90,1],[6,135,383,90,1],[7,122,527,90,1],[8,111,628,90,1],
[9,502,642,0],[10,583,642,0],[11,735,595,40,1],[12,837,537,40,1],[13,907,452,40],[14,988,384,40],[15,1069,310,40],
[16,1104,113,0],[17,996,113,0],[18,888,113,0],[19,780,111,0],[20,562,321,0,1],[21,446,321,0,1],[22,325,321,0,1],
[23,297,500,0],[24,408,500,0],[25,515,500,0],[26,632,471,40],[27,710,397,40],[28,790,320,40]];
const S=0.205, W=(x,y)=>[(x-850)*S,(y-400)*S];
const towers=T.map(([n,x,y,r,big])=>{const off=r==90?[16,0]:r==40?[12,14]:[14,18];const [wx,wz]=W(x+off[0],y+off[1]);
 return {n,x:wx,z:wz,rot:r*Math.PI/180,big:!!big,w:big?17:16,d:big?14:13}});

let seed=20260910;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const pick=a=>a[Math.floor(rnd()*a.length)];
const NOMES=['Ana','Bruno','Carla','Diego','Eduarda','Felipe','Gabriela','Henrique','Isabela','João','Karina','Lucas','Mariana','Nicolas','Patrícia','Rafael','Sabrina','Thiago','Vanessa','Wesley','Juliana','Marcos','Letícia','André'];
const SOBR=['Silva','Souza','Oliveira','Pereira','Costa','Rodrigues','Almeida','Nascimento','Lima','Araújo','Ferreira','Carvalho','Gomes','Martins','Rocha','Ribeiro','Kowalski','Schmidt','Andrade','Moreira'];
const obra={};towers.forEach(t=>{obra[t.n]=t.n<=10?100:t.n<=19?Math.round(84+rnd()*15):Math.round(38+rnd()*45)});
const units=[];let vaga=1;
towers.forEach(t=>{for(let f=1;f<=4;f++)for(let p=1;p<=4;p++){const r=rnd();const occ=obra[t.n]<100?'Em obra':r<.7?'Proprietário':r<.88?'Alugado':'Vago';
 units.push({id:`T${t.n}-${f}0${p}`,t:t.n,f,p,num:`${f}0${p}`,vaga:vaga++,occ,nome:occ=='Vago'?'—':`${pick(NOMES)} ${pick(SOBR)}`,
 inad:(occ=='Proprietário'||occ=='Alugado')&&rnd()<.08,ch:Math.max(0,Math.round(rnd()*3.2-1.6)),
 ent:obra[t.n]<100?'Aguardando':rnd()<.9?'Entregue':'Vistoria agendada'})}});
const U=id=>units.find(u=>u.id==id);
const ME='T1-304';U(ME).nome='Morador Exemplo';U(ME).occ='Proprietário';U(ME).inad=false;U(ME).vaga=121;

const state={role:'morador',view:'site',tower:null,unit:null,tab:0,
 avisos:[{t:'Manutenção dos portões',d:'Portão de veículos em manutenção sexta, 8h–12h.',q:'2 dias'},{t:'Assembleia ordinária',d:'Dia 12/12 às 19h no salão de festas.',q:'5 dias'}],
 reservas:[{a:'Salão de festas',d:'2026-12-06',u:'T4-201',s:'Aprovada'},{a:'Churrasqueira 2',d:'2026-11-29',u:ME,s:'Pendente'}],
 chamados:[{id:1031,u:ME,tipo:'Assistência técnica',d:'Infiltração no peitoril do Quarto 02',s:'Em análise'},{id:1028,u:'T7-102',tipo:'Ocorrência',d:'Barulho após 22h na torre 07',s:'Aberto'},
 {id:1022,u:'T3-404',tipo:'Assistência técnica',d:'Porta da sacada desalinhada',s:'Agendado'},{id:1019,u:'T9-301',tipo:'Assistência técnica',d:'Trinca no revestimento da cozinha',s:'Concluído'}],
 encomendas:[],visitas:[],acessos:[]};
{let s2=777;const r2=()=>(s2=(s2*16807)%2147483647)/2147483647;const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ',d=()=>Math.floor(r2()*10),l=()=>L[Math.floor(r2()*26)];
 units.forEach(u=>{if(u.occ=='Proprietário'||u.occ=='Alugado')u.placa=l()+l()+l()+d()+l()+d()+d()});U(ME).placa='BEE4R22';
 const hab=units.filter(u=>u.placa),pk=()=>hab[Math.floor(r2()*hab.length)];const H=new Date().toISOString().slice(0,10);
 state.encomendas.push({id:1,u:ME,d:'Mercado Livre · caixa média',q:'hoje 14:20',s:'Aguardando'},{id:2,u:ME,d:'Correios · envelope',q:'ontem',s:'Aguardando'});
 ['Shopee · pacote','Amazon · caixa','Correios · caixa','Magalu · caixa grande','Jadlog · envelope','iFood Mercado · sacola','Correios · envelope'].forEach((x,i)=>state.encomendas.push({id:3+i,u:pk().id,d:x,q:i<4?'hoje':'ontem',s:i==6?'Retirada':'Aguardando'}));
 state.visitas.push({id:1,u:ME,nome:'Mariana Souza',placa:'RHT4E21',data:H,s:'Autorizada'},{id:2,u:pk().id,nome:'Carlos Mendes',placa:'',data:H,s:'Autorizada'},{id:3,u:pk().id,nome:'Fernanda Lopes',placa:'QZA2B19',data:H,s:'Entrou'});
 const ac=[['07:42','08:10','Morador'],['08:05',null,'Prestador'],['09:30',null,'Visitante'],['10:12','11:40','Entrega'],['11:02',null,'Morador'],['13:25',null,'Morador']];
 ac.forEach(([i,o,tp],k)=>{const u=tp=='Visitante'?U(state.visitas[2].u):pk();state.acessos.unshift({id:k+1,placa:tp=='Visitante'?'QZA2B19':tp=='Morador'?u.placa:l()+l()+l()+d()+l()+d()+d(),u:u.id,tipo:tp,quem:tp=='Morador'?u.nome:tp=='Visitante'?'Fernanda Lopes':tp=='Prestador'?'Manutenção elevador':'Transportadora',in:i,out:o})})}

/* ---------- Cores por modo ---------- */
const C={ok:'#2f8f6b',rent:'#6aa9d8',vago:'#c4c9c6',bad:'#d9503a',warn:'#f0b13e',base:'#eeece6',me:'#f0a92a',obra:'#d8d2c4'};
const MODES={morador:[['me','Minha unidade']],porteiro:[['real','Visual real'],['enc','Encomendas na portaria'],['vis','Visitas hoje']],sindico:[['real','Visual real'],['occ','Ocupação'],['inad','Inadimplência'],['ch','Chamados abertos']],construtora:[['real','Visual real'],['obra','Andamento da obra'],['ent','Entrega das unidades'],['at','Assistência técnica']]};
let mode='me';
function ucolor(u){switch(mode){
 case 'real':return C.base;
 case 'enc':return state.encomendas.some(e=>e.u==u.id&&e.s=='Aguardando')?C.me:C.base;
 case 'vis':return state.visitas.some(v=>v.u==u.id&&v.s!='Saiu')?'#3f86c4':C.base;
 case 'me':return u.id==ME?C.me:u.t==1?'#f3e6c8':C.base;
 case 'occ':return u.occ=='Proprietário'?C.ok:u.occ=='Alugado'?C.rent:u.occ=='Vago'?C.vago:C.obra;
 case 'inad':return u.occ=='Vago'||u.occ=='Em obra'?C.vago:u.inad?C.bad:C.ok;
 case 'ch':return u.ch==0?'#dbe7e0':u.ch==1?C.warn:C.bad;
 case 'obra':{const p=obra[u.t];return p==100?C.ok:p>=80?C.warn:'#d98b3a'}
 case 'ent':return u.ent=='Entregue'?C.ok:u.ent=='Vistoria agendada'?C.warn:C.vago;
 case 'at':{const n=state.chamados.filter(c=>c.u==u.id&&c.tipo=='Assistência técnica'&&c.s!='Concluído').length+(u.ch>1?1:0);return n==0?'#dbe7e0':n==1?C.warn:C.bad}}}
const LEG={enc:[[C.me,'Com encomenda aguardando'],[C.base,'Sem encomenda']],vis:[['#3f86c4','Visita autorizada ou dentro'],[C.base,'Sem visita']],real:[['#eeece6','Fachada'],['#6d6259','Núcleo e sacadas'],['#2e3a44','Esquadrias']],me:[[C.me,'Seu apartamento'],['#f3e6c8','Sua torre']],occ:[[C.ok,'Proprietário'],[C.rent,'Alugado'],[C.vago,'Vago'],[C.obra,'Em obra']],
 inad:[[C.ok,'Em dia'],[C.bad,'Inadimplente'],[C.vago,'Sem cobrança']],ch:[['#dbe7e0','Nenhum'],[C.warn,'1'],[C.bad,'2 ou mais']],

 case 'reservasS':return `<h2>Reservas</h2><div class="list">${state.reservas.map((x,i)=>`<div class="item"><div><strong>${esc(x.a)}</strong><p>${fmtData(x.d)} · ${esc(uName(x.u))}</p></div><div class="act">${tag(x.s)}${x.s=='Pendente'?`<button class="btn sm" data-apr="${i}">Aprovar</button>`:''}</div></div>`).join('')}</div>`;

 case 'unidadeS':return `<h2>Apto ${u.num} · Torre ${u.t}</h2><p class="sub">${esc(u.nome)}</p>${unitDl(u,true)}<h3>Contato</h3><p class="sub">(41) 9${String(8000+u.vaga*7).slice(0,4)}-${String(1000+u.vaga*13).slice(-4)} · ${esc(u.nome.split(' ')[0].toLowerCase())}@email.com</p>`;

 case 'torreC':return `<h2>Torre ${t} · ${obra[t]}%</h2><p class="sub">Toque num apartamento para ver a planta</p><div class="bar"><i style="width:${obra[t]}%"></i></div><br>${kpis([[String(units.filter(x=>x.t==t&&x.ent=='Entregue').length),'Entregues'],[String(state.chamados.filter(c=>U(c.u).t==t&&c.tipo=='Assistência técnica').length),'Chamados de garantia']])}`;

 return ''}

function render(keepScroll){const r=state.role;$('#who').textContent={morador:'Morador exemplo · Torre 1, apto 304',porteiro:'Portaria · turno diurno',sindico:'Síndico · gestão 2026',construtora:'Construtora · pós-obra'}[r];
 const tabs=TABS[r][state.view];if(state.tab>=tabs.length)state.tab=0;
 $('#tabs').classList.toggle('many',tabs.length>5);$('#tabs').innerHTML=tabs.map((k,i)=>`<button role="tab" aria-selected="${i==state.tab}" data-tab="${i}">${icon(TABMETA[k][1])}<span>${TABMETA[k][0]}</span></button>`).join('');
 const st=$('#panel').scrollTop;$('#panel').innerHTML=view()+'<p class="note">Dados de exemplo para demonstração. Implantação e planta extraídas dos projetos enviados.</p>';if(keepScroll)$('#panel').scrollTop=st;
 const cr=[['Condomínio',goSite]];if(state.tower)cr.push([`Torre ${state.tower}`,()=>goTower(state.tower)]);if(state.unit)cr.push([`Apto ${U(state.unit).num}`,()=>{}]);
 $('#crumbs').innerHTML='';cr.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;$('#crumbs').appendChild(b)});
 $('#modes').style.display=state.view=='unit'?'none':'';
 $('#hint').textContent=state.view=='site'?'Arraste para girar · role para aproximar · clique numa torre':state.view=='tower'?'Clique num apartamento para abrir a planta 3D':'Arraste para girar a planta'}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){state.tab=+b.dataset.tab;render();if(matchMedia('(max-width:860px)').matches)$('aside').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})}};

 if(o){const x=state.acessos.find(x=>x.id==o.dataset.out);x.out=now();const vv=state.visitas.find(v=>v.s=='Entrou'&&v.u==x.u&&normPlaca(v.placa)==x.placa);if(vv)vv.s='Saiu';render(1);paint()}

 if(vi){const v=state.visitas.find(x=>x.id==vi.dataset.in);v.s='Entrou';entrada(v.placa,v.u,'Visitante',v.nome);render(1);paint()}
 if(vo){const v=state.visitas.find(x=>x.id==vo.dataset.vout);v.s='Saiu';const x=state.acessos.find(x=>!x.out&&x.u==v.u&&x.quem==v.nome);if(x)x.out=now();render(1);paint()}

 if(e.target.id!='q')return;const q=e.target.value.toLowerCase();
 $('#tb').innerHTML=rows(units.filter(x=>(!state.tower||x.t==state.tower)&&(`t${x.t} ${x.num} torre ${x.t} ${x.nome}`).toLowerCase().includes(q)).slice(0,80))});

document.querySelectorAll('.roles button').forEach(b=>b.onclick=()=>setRole(b.dataset.role));

/* ---------- Loop ---------- */
const v3=new THREE.Vector3();
function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
const ro=new ResizeObserver(size);ro.observe(stage);
function project(obj,el,dy=0){obj.getWorldPosition(v3);v3.y+=dy;v3.project(cam);if(v3.z>1){el.style.display='none';return}
 el.style.display='';el.style.left=(v3.x+1)/2*stage.clientWidth+'px';el.style.top=(1-v3.y)/2*stage.clientHeight+'px'}
function loop(now){requestAnimationFrame(loop);
 for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];const k=(now-w.t0)/w.dur;if(k<0)continue;w.fn(Math.min(1,k));if(k>=1){tweens.splice(i,1);w.res()}}
 ctr.update();const sv=site.visible&&state.view!='unit';
 towers.forEach(t=>{if(!sv||(state.view=='tower'&&t.n!=state.tower)){t.lb.style.display='none';return}project(t.floors[3],t.lb,FH+1.5)});
 {const o=new THREE.Vector3(),n=new THREE.Vector3(0,0,-60);o.project(cam);n.project(cam);$('#north i').style.transform=`rotate(${Math.atan2(n.x-o.x,(n.y-o.y)*cam.aspect)}rad)`}
 if(plan.visible&&plan.userData.rl)plan.userData.rl.forEach(r=>project(r.o,r.e,.3));
 renderer.render(scene,cam)}
setRole('morador');size();
cam.position.set(-420,360,460);ctr.target.set(0,0,0);requestAnimationFrame(loop);
// abertura: torres sobem da maquete e a câmera desce
towers.forEach(t=>{const d=Math.hypot(t.x+60,t.z);t.floors.forEach((fl,i)=>tween(650,k=>{fl.scale.y=Math.max(.001,ease(k))},300+d*6+i*110))});
fly(HOME[0],HOME[1],2600);
}
